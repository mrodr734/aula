<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Simulador Teatral 3D Pro - DMX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #viewport {
      flex: 1;
      position: relative;
      background: #000;
    }
    canvas { display: block; width: 100%; height: 100%; }

    /* TAULA DMX UI */
    #console {
      height: 380px;
      background: #18181c;
      border-top: 2px solid #333;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
      z-index: 10;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #222228;
      border-bottom: 1px solid #333;
    }

    .toolbar h2 {
      font-size: 1rem;
      color: #00bcd4;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .btn-group { display: flex; gap: 8px; }

    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    button:hover { background: #444; border-color: #777; }
    button.rec { background: #9c0000; border-color: #e53935; }
    button.rec:hover { background: #c62828; }
    button.play { background: #1b5e20; border-color: #43a047; }
    button.play:hover { background: #2e7d32; }

    /* CARDS DMX */
    .faders-wrapper {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 15px 20px;
      flex: 1;
    }

    .card {
      background: #22222a;
      border: 1px solid #333342;
      border-radius: 6px;
      min-width: 185px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #ffb74d;
      text-align: center;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }

    .ch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.7rem;
    }

    .ch-row label { width: 45px; color: #aaa; }
    .ch-row input[type=range] { flex: 1; margin: 0 6px; height: 4px; accent-color: #00bcd4; }
    .ch-row input[type=color] { border: none; width: 25px; height: 20px; cursor: pointer; background: transparent; }
    .ch-row val { width: 25px; text-align: right; font-family: monospace; color: #fff; }

    /* Overlay informatiu */
    #info-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 0.8rem;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>

  <!-- Three.js i OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="viewport">
    <div id="info-overlay">
      <strong>Moure càmera:</strong> Clic esquerre + Arrossegar<br>
      <strong>Zoom:</strong> Roda del ratolí | <strong>Panoràmica:</strong> Clic dret
    </div>
  </div>

  <div id="console">
    <div class="toolbar">
      <h2>Taula de Control DMX Pro (3D Realtime)</h2>
      <div class="btn-group">
        <button class="rec" onclick="recordScene()">● Enregistrar Escena</button>
        <button class="play" onclick="playScene(0)">Escena 1</button>
        <button class="play" onclick="playScene(1)">Escena 2</button>
        <button class="play" onclick="playScene(2)">Escena 3</button>
        <button onclick="clearScenes()">Netejar</button>
      </div>
    </div>
    <div class="faders-wrapper" id="fader-container"></div>
  </div>

  <script>
    // --- 1. CONFIGURACIÓ DE L'ESCENA 3D ---
    const viewport = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.015); // Boira/Fum teatral per veure els feixos

    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(0, 12, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    viewport.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 4, 0);
    controls.update();

    // --- 2. ENTORN DEL TEATRE ---
    // Llum ambiental residual
    const ambientLight = new THREE.AmbientLight(0x111118, 0.2);
    scene.add(ambientLight);

    // Terra / Escenari
    const stageGeo = new THREE.BoxGeometry(20, 0.6, 12);
    const stageMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });
    const stage = new THREE.Mesh(stageGeo, stageMat);
    stage.position.set(0, 0, 0);
    stage.receiveShadow = true;
    scene.add(stage);

    // Pared de fons (Ciclorama per "pintar" amb llum)
    const wallGeo = new THREE.PlaneGeometry(24, 12);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.8 });
    const backWall = new THREE.Mesh(wallGeo, wallMat);
    backWall.position.set(0, 6, -6);
    backWall.receiveShadow = true;
    scene.add(backWall);

    // Elements d'espectacle a l'escenari (per rebre ombres i llum)
    const actorGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 16);
    const actorMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
    const actor = new THREE.Mesh(actorGeo, actorMat);
    actor.position.set(0, 1.2, 0);
    actor.castShadow = true;
    actor.receiveShadow = true;
    scene.add(actor);

    // Estructures / Barres de llum (Trusses)
    function createTruss(x, y, z, length) {
      const geo = new THREE.BoxGeometry(length, 0.2, 0.2);
      const mat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8 });
      const truss = new THREE.Mesh(geo, mat);
      truss.position.set(x, y, z);
      scene.add(truss);
    }
    createTruss(0, 8, 7, 18);   // Barra Frontal
    createTruss(0, 9, 0, 16);   // Barra Superior Mitja
    createTruss(0, 10, -4, 16); // Barra Superior Posterior

    // --- 3. CREACIÓ D'EQUIPAMENT D'IL·LUMINACIÓ ---
    const fixtures = [];

    class Fixture {
      constructor(id, name, type, x, y, z, rx=0, ry=0) {
        this.id = id;
        this.name = name;
        this.type = type; // 'fixed' o 'moving'
        
        // Estructura física 3D
        this.group = new THREE.Group();
        this.group.position.set(x, y, z);

        // Foco de llum Spot
        this.light = new THREE.SpotLight(0xffffff, 0);
        this.light.angle = Math.PI / 6; // Opertura del feix
        this.light.penumbra = 0.4;      // Suavitat de les vores
        this.light.decay = 1.5;
        this.light.distance = 35;
        this.light.castShadow = true;
        this.light.shadow.mapSize.width = 1024;
        this.light.shadow.mapSize.height = 1024;

        // Objectiu a on apunta la llum
        this.target = new THREE.Object3D();
        this.target.position.set(x, 0, z - (type === 'front' ? 6 : 0));
        scene.add(this.target);
        this.light.target = this.target;

        this.group.add(this.light);

        // Conus de visibilitat volumètrica (simulació de boira en el feix)
        const coneGeo = new THREE.ConeGeometry(3, 15, 32, 1, true);
        coneGeo.translate(0, -7.5, 0);
        coneGeo.rotateX(-Math.PI / 2);
        const coneMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        this.beam = new THREE.Mesh(coneGeo, coneMat);
        this.group.add(this.beam);

        scene.add(this.group);

        // Valors DMX
        this.dimmer = 200;
        this.color = "#ffffff";
        this.pan = 127;
        this.tilt = 127;
        this.focus = 30; // Àngul d'obertura

        this.update();
      }

      update() {
        // Actualitzar color i dimmer
        const hex = parseInt(this.color.replace("#", "0x"));
        this.light.color.setHex(hex);
        this.beam.material.color.setHex(hex);

        const intensity = (this.dimmer / 255) * 15;
        this.light.intensity = intensity;
        this.beam.material.opacity = (this.dimmer / 255) * 0.25; // Transparència de la boira

        // Ajust del Focus (Obertura del feix)
        const angleRad = (this.focus / 255) * (Math.PI / 4 - 0.1) + 0.1;
        this.light.angle = angleRad;
        const scale = Math.tan(angleRad) * 4;
        this.beam.scale.set(scale, 1, scale);

        // Moviment Pan / Tilt
        if (this.type === 'moving') {
          const panAngle = ((this.pan - 127) / 127) * Math.PI;
          const tiltAngle = ((this.tilt - 127) / 127) * (Math.PI / 3);

          const basePos = this.group.position;
          const targetX = basePos.x + Math.sin(panAngle) * 10;
          const targetZ = basePos.z - Math.cos(panAngle) * 10 + Math.sin(tiltAngle) * 5;
          const targetY = Math.max(0, basePos.y - 10 + Math.cos(tiltAngle) * 5);

          this.target.position.set(targetX, targetY, targetZ);
          this.beam.lookAt(this.target.position);
        } else {
          this.beam.lookAt(this.target.position);
        }
      }
    }

    // ARQUITECTURA DE LLUMS DEMANADA:
    let idCounter = 1;

    // 1. BARRA DE LLUMS FRONTAL (4 Focus per a cobrir i pintar l'escena)
    for (let i = -3; i <= 3; i += 2) {
      const f = new Fixture(idCounter, `Frontal ${idCounter}`, 'fixed', i * 2.5, 8, 7);
      f.target.position.set(i * 2, 1, 0);
      fixtures.push(f);
      idCounter++;
    }

    // 2. 4 CAPS MÒBILS SOBRE L'ESCENARI (Terra / Tarima)
    const stagePositions = [-6, -2, 2, 6];
    stagePositions.forEach((x, idx) => {
      const f = new Fixture(idCounter, `Mòbil Terra ${idx+1}`, 'moving', x, 0.4, -3);
      f.color = "#00ffff";
      fixtures.push(f);
      idCounter++;
    });

    // 3. 8 CAPS MÒBILS A LES BARRES SUPERIORS (Barres d'altitud)
    // Barra posterior (4 units) - "Pintar fons"
    for (let i = -6; i <= 6; i += 4) {
      const f = new Fixture(idCounter, `Mòbil Alt-Post ${idCounter}`, 'moving', i, 10, -4);
      f.color = "#ff00ff";
      fixtures.push(f);
      idCounter++;
    }
    // Barra central (4 units)
    for (let i = -6; i <= 6; i += 4) {
      const f = new Fixture(idCounter, `Mòbil Alt-Cen ${idCounter}`, 'moving', i, 9, 0);
      f.color = "#ff9900";
      fixtures.push(f);
      idCounter++;
    }


    // --- 4. CONSTRUCCIÓ INTERFÍCIE TAULA DMX ---
    function buildDMXUI() {
      const container = document.getElementById('fader-container');
      container.innerHTML = '';

      fixtures.forEach(fix => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="card-title">${fix.name}</div>`;

        // Dimmer
        card.appendChild(createChannel('Dimmer', fix.dimmer, 0, 255, v => { fix.dimmer = v; fix.update(); }));

        // Color Picker
        const colorRow = document.createElement('div');
        colorRow.className = 'ch-row';
        colorRow.innerHTML = `<label>Color</label><input type="color" value="${fix.color}">`;
        colorRow.querySelector('input').addEventListener('input', e => { fix.color = e.target.value; fix.update(); });
        card.appendChild(colorRow);

        // Pan/Tilt (Si és mòbil)
        if (fix.type === 'moving') {
          card.appendChild(createChannel('Pan', fix.pan, 0, 255, v => { fix.pan = v; fix.update(); }));
          card.appendChild(createChannel('Tilt', fix.tilt, 0, 255, v => { fix.tilt = v; fix.update(); }));
        }

        // Focus / Obertura
        card.appendChild(createChannel('Focus', fix.focus, 0, 255, v => { fix.focus = v; fix.update(); }));

        container.appendChild(card);
      });
    }

    function createChannel(label, initialVal, min, max, onChange) {
      const row = document.createElement('div');
      row.className = 'ch-row';
      row.innerHTML = `
        <label>${label}</label>
        <input type="range" min="${min}" max="${max}" value="${initialVal}">
        <val>${initialVal}</val>
      `;
      const input = row.querySelector('input');
      const valDisplay = row.querySelector('val');
      input.addEventListener('input', e => {
        const v = parseInt(e.target.value);
        valDisplay.textContent = v;
        onChange(v);
      });
      return row;
    }

    // --- 5. GESTIÓ DE MEMÒRIES DMX ---
    let savedScenes = [];

    function recordScene() {
      const snapshot = fixtures.map(f => ({
        dimmer: f.dimmer,
        color: f.color,
        pan: f.pan,
        tilt: f.tilt,
        focus: f.focus
      }));
      savedScenes.push(snapshot);
      alert(`Escena ${savedScenes.length} guardada amb èxit.`);
    }

    function playScene(index) {
      if (!savedScenes[index]) {
        alert(`L'Escena ${index + 1} està buida.`);
        return;
      }
      const data = savedScenes[index];
      data.forEach((state, i) => {
        Object.assign(fixtures[i], state);
        fixtures[i].update();
      });
      buildDMXUI();
    }

    function clearScenes() {
      savedScenes = [];
      alert('Memòries esborrades.');
    }

    // --- 6. RENDER LOOP & RESIZE ---
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });

    // Inicialització
    buildDMXUI();
    animate();
  </script>
</body>
</html>
