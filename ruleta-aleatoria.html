<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta aleatòria</title>
    <!-- Favicon ☘️ -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☘️</text></svg>">
    <!-- Llibreria per al efecte de confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #2e7d32;
            --bg: #f4f6f8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        .input-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        .wheel-section {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
        }

        /* Indicador / Agulla */
        .arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #d32f2f;
            z-index: 10;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #1b5e20;
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
            min-height: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>☘️ Ruleta aleatòria</h1>

    <div class="container">
        <div class="input-section">
            <label for="options"><strong>Escriu les opcions (una per línia):</strong></label>
            <textarea id="options" placeholder="Opció 1&#10;Opció 2&#10;Opció 3&#10;Opció 4">Opció 1
Opció 2
Opció 3
Opció 4</textarea>
        </div>

        <div class="wheel-section">
            <div class="wheel-container">
                <div class="arrow"></div>
                <canvas id="canvas" width="320" height="320"></canvas>
            </div>
            <button id="spinBtn">Girar la ruleta!</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const textarea = document.getElementById('options');
        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('result');

        let options = [];
        let startAngle = 0;
        let isSpinning = false;

        // Paleta de colors
        const colors = ['#4CAF50', '#FF9800', '#2196F3', '#E91E63', '#9C27B0', '#00BCD4', '#FFEB3B', '#FF5722'];

        function getOptions() {
            return textarea.value
                .split('\n')
                .map(opt => opt.trim())
                .filter(opt => opt.length > 0);
        }

        function drawWheel() {
            options = getOptions();
            const numOptions = options.length;
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (numOptions === 0) {
                ctx.beginPath();
                ctx.arc(radius, radius, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#ccc';
                ctx.fill();
                return;
            }

            const arcSize = (2 * Math.PI) / numOptions;

            for (let i = 0; i < numOptions; i++) {
                const angle = startAngle + i * arcSize;
                
                // Dibuixar sector
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + arcSize);
                ctx.lineTo(radius, radius);
                ctx.fill();

                // Dibuixar text
                ctx.save();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px sans-serif';
                ctx.translate(
                    radius + Math.cos(angle + arcSize / 2) * (radius * 0.65),
                    radius + Math.sin(angle + arcSize / 2) * (radius * 0.65)
                );
                ctx.rotate(angle + arcSize / 2 + Math.PI / 2);
                
                let text = options[i];
                if (text.length > 12) text = text.substring(0, 10) + '...';
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            }
        }

        function spin() {
            if (isSpinning) return;
            options = getOptions();
            if (options.length < 2) {
                alert("Afegeix almenys 2 opcions per girar la ruleta!");
                return;
            }

            isSpinning = true;
            resultDiv.innerText = '';

            const spinDuration = 4000; // 4 segons
            const start = performance.now();
            const initialAngle = startAngle;
            
            // Voltes aleatòries + angle final
            const totalRotation = (Math.floor(Math.random() * 5) + 5) * 2 * Math.PI + Math.random() * 2 * Math.PI;

            function animate(now) {
                const elapsed = now - start;
                const progress = Math.min(elapsed / spinDuration, 1);
                
                // Funció de frenada (easeOutCubic)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                startAngle = initialAngle + easeOut * totalRotation;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    getWinner();
                }
            }

            requestAnimationFrame(animate);
        }

        function getWinner() {
            const numOptions = options.length;
            const arcSize = (2 * Math.PI) / numOptions;
            
            // Ajustem l'angle respecte l'indicador superior (270º o 3PI/2)
            let normalizedAngle = (1.5 * Math.PI - (startAngle % (2 * Math.PI))) % (2 * Math.PI);
            if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

            const winningIndex = Math.floor(normalizedAngle / arcSize);
            const winner = options[winningIndex];

            resultDiv.innerText = `Ha tocat: ${winner}! 🎉`;

            // Efecte Confetti
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Esdeveniments
        textarea.addEventListener('input', drawWheel);
        spinBtn.addEventListener('click', spin);

        // Dibuix inicial
        drawWheel();
    </script>
</body>
</html>
